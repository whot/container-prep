name: 'Container Prep'
description: >
  Build a container image if a tagged version does not already exist in the
  registry.  When the image is already present the build is skipped entirely,
  making CI pipelines faster on repeated runs.

branding:
  icon: 'box'
  color: 'blue'

inputs:
  distro:
    description: >
      Base OCI image distro name (e.g. "fedora", "ubuntu", "alpine").
    required: false
  distro-version:
    description: >
      Base OCI image distro version (e.g. "44", "24.04", "3.20").
    required: false
  base-image:
    description: >
      Base OCI image to build from (e.g. "fedora:44", "ubuntu:24.04",
      "alpine:3.20"). Replaces the distro and distro-version
      options if set.
    required: false
  tag:
    description: >
      Tag for the built image.  Use a value that changes when the image
      content should change. It's common to use a date-based tag like
      "2024-03-20.0" for readability.
    required: true
  packages:
    description: 'Space-separated list of packages to install.'
    required: false
    default: ''
  suffix:
    description: >
      Optional path suffix appended to the image name.  Defaults to the
      distro/version extracted from base-image (e.g. "fedora/44").
    required: false
    default: ''
  registry:
    description: 'Container registry to push to.'
    required: false
    default: 'ghcr.io'
  token:
    description: >
      Authentication token for the registry.  Defaults to the automatic
      GITHUB_TOKEN which has push access to ghcr.io/<owner>/<repo>.
    required: false
    default: ${{ github.token }}
  exec:
    description: >
      Shell commands to run inside the container after packages are
      installed (e.g. "pip install meson" or a multi-line script).
      The working directory is set to a copy of the repository
      checkout; the copy is removed after exec completes so it
      does not end up in the final image.
    required: false
    default: ''
  workdir:
    description: 'Working directory inside the container.'
    required: false
    default: '/github/workspace'
  force-rebuild:
    description: >
      Set to "true" to force a build even if a cached image with
      that tag already exists.
    required: false
    default: 'false'
  platform:
    description: >
      Target platform for the container image (e.g. "linux/amd64",
      "linux/arm64", "linux/386").  When set, this value is passed
      to "buildah from --platform".  Leave empty to use the host
      platform (the default).
    required: false
    default: ''
outputs:
  image:
    description: 'Full image reference (registry/path:tag) for downstream jobs.'
    value: ${{ steps.prep.outputs.image }}
  build-skipped:
    description: '"true" if the image already existed and the build was skipped.'
    value: ${{ steps.prep.outputs.build-skipped }}

runs:
  using: composite
  steps:
    - id: prep
      shell: bash
      env:
        # exec may be multi-line, pass via env to avoid quoting issues
        INPUT_EXEC: ${{ inputs.exec }}

      run: |
        args=()
        args+=(--tag '${{ inputs.tag }}')
        args+=(--user '${{ github.actor }}')
        args+=(--token '${{ inputs.token }}')
        args+=(--upstream-repo '${{ github.repository }}')

        if [[ -n '${{ inputs.distro }}' ]]; then
          args+=(--distro '${{ inputs.distro }}')
        fi
        if [[ -n '${{ inputs.distro-version }}' ]]; then
          args+=(--distro-version '${{ inputs.distro-version }}')
        fi
        if [[ -n '${{ inputs.base-image }}' ]]; then
          args+=(--base-image '${{ inputs.base-image }}')
        fi
        if [[ -n '${{ inputs.packages }}' ]]; then
          args+=(--packages '${{ inputs.packages }}')
        fi
        if [[ -n '${{ inputs.suffix }}' ]]; then
          args+=(--suffix '${{ inputs.suffix }}')
        fi
        if [[ -n '${{ inputs.registry }}' && '${{ inputs.registry }}' != 'ghcr.io' ]]; then
          args+=(--registry '${{ inputs.registry }}')
        fi
        if [[ -n "$INPUT_EXEC" ]]; then
          args+=(--exec "$INPUT_EXEC")
        fi
        if [[ -n '${{ inputs.workdir }}' && '${{ inputs.workdir }}' != '/github/workspace' ]]; then
          args+=(--workdir '${{ inputs.workdir }}')
        fi
        if [[ -n '${{ inputs.platform }}' ]]; then
          args+=(--platform '${{ inputs.platform }}')
        fi
        if [[ '${{ inputs.force-rebuild }}' == 'true' ]]; then
          args+=(--force)
        fi
        if [[ -n '${{ github.event.pull_request.head.repo.full_name }}' ]]; then
          args+=(--user-repo '${{ github.event.pull_request.head.repo.full_name }}')
        fi

        "${{ github.action_path }}/container-prep.sh" "${args[@]}"
