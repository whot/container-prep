# Test individual features of the container-prep action:
# cache hits, force-rebuild, exec, workdir, fork PR handling,
# and input validation.

name: Test features

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # ── Cache hit ──────────────────────────────────────────────────────
  # Build an image, then call the action again with the same tag.
  # The second call must skip the build.
  cache-hit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7

      - name: First build (cold cache)
        id: first
        uses: ./
        with:
          distro: 'alpine'
          distro-version: '3.20'
          tag: 'cache-test-${{ github.sha }}'
          packages: 'curl'

      - name: Second call (warm cache)
        id: second
        uses: ./
        with:
          distro: 'alpine'
          distro-version: '3.20'
          tag: 'cache-test-${{ github.sha }}'
          packages: 'curl'

      - name: Verify cache was used
        run: |
          [[ "${{ steps.first.outputs.build-skipped }}" == "false" ]] \
            || { echo "::error::first build should not have been skipped"; exit 1; }
          [[ "${{ steps.second.outputs.build-skipped }}" == "true" ]] \
            || { echo "::error::second build should have been skipped (cache hit)"; exit 1; }
          [[ "${{ steps.first.outputs.image }}" == "${{ steps.second.outputs.image }}" ]] \
            || { echo "::error::image references should match"; exit 1; }

  # ── Force rebuild ──────────────────────────────────────────────────
  # Build an image, then call again with force-rebuild.
  # The second call must NOT skip the build.
  force-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7

      - name: First build
        id: first
        uses: ./
        with:
          distro: 'alpine'
          distro-version: '3.20'
          tag: 'force-test-${{ github.sha }}'
          packages: 'curl'

      - name: Force rebuild
        id: forced
        uses: ./
        with:
          distro: 'alpine'
          distro-version: '3.20'
          tag: 'force-test-${{ github.sha }}'
          packages: 'curl'
          force-rebuild: 'true'

      - name: Verify rebuild happened
        run: |
          [[ "${{ steps.forced.outputs.build-skipped }}" == "false" ]] \
            || { echo "::error::force-rebuild should not skip"; exit 1; }

  # ── exec ───────────────────────────────────────────────────────────
  # Run a custom command that creates a marker file.
  # Verify the file exists in the resulting image.
  exec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7

      - name: Build with exec
        id: prep
        uses: ./
        with:
          distro: 'alpine'
          distro-version: '3.20'
          tag: 'exec-test-${{ github.sha }}'
          exec: |
            touch /exec-marker
            echo "hello from exec" > /exec-output.txt

      - name: Verify exec results
        run: |
          podman run --rm "${{ steps.prep.outputs.image }}" \
            test -f /exec-marker \
            || { echo "::error::/exec-marker not found"; exit 1; }
          got=$(podman run --rm "${{ steps.prep.outputs.image }}" \
            cat /exec-output.txt)
          [[ "$got" == "hello from exec" ]] \
            || { echo "::error::unexpected exec output: $got"; exit 1; }

  # ── exec: repo checkout available ────────────────────────────────
  # Verify that the repository checkout is the working directory
  # during exec and that the checkout is cleaned up afterwards.
  exec-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7

      - name: Build with exec that reads repo files
        id: prep
        uses: ./
        with:
          distro: 'alpine'
          distro-version: '3.20'
          tag: 'execrepo-test-${{ github.sha }}'
          exec: |
            test -f action.yml
            test -f container-prep.py
            cp action.yml /repo-marker.yml

      - name: Verify exec could read repo files
        run: |
          podman run --rm "${{ steps.prep.outputs.image }}" \
            test -f /repo-marker.yml \
            || { echo "::error::/repo-marker.yml not found"; exit 1; }

      - name: Verify checkout was cleaned up
        run: |
          # The repo copy should not exist in the final image.
          # The exact location is an implementation detail, but
          # action.yml must not be reachable at the container workdir.
          rc=0
          podman run --rm "${{ steps.prep.outputs.image }}" \
            test -f action.yml 2>/dev/null || rc=$?
          [[ "$rc" -ne 0 ]] \
            || { echo "::error::repo checkout should have been removed"; exit 1; }

  # ── exec: environment forwarding ─────────────────────────────────
  # Verify that host environment variables are forwarded into exec.
  exec-env:
    runs-on: ubuntu-latest
    env:
      CUSTOM_VAR: 'hello-from-host'
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7

      - name: Build with exec that reads host env
        id: prep
        uses: ./
        with:
          distro: 'alpine'
          distro-version: '3.20'
          tag: 'execenv-test-${{ github.sha }}'
          exec: |
            echo "$CUSTOM_VAR" > /env-marker.txt
            echo "$GITHUB_REPOSITORY" > /repo-marker.txt

      - name: Verify custom env var was forwarded
        run: |
          got=$(podman run --rm "${{ steps.prep.outputs.image }}" \
            cat /env-marker.txt)
          [[ "$got" == "hello-from-host" ]] \
            || { echo "::error::expected 'hello-from-host', got: $got"; exit 1; }

      - name: Verify GITHUB_* env var was forwarded
        run: |
          got=$(podman run --rm "${{ steps.prep.outputs.image }}" \
            cat /repo-marker.txt)
          [[ "$got" == "${{ github.repository }}" ]] \
            || { echo "::error::expected '${{ github.repository }}', got: $got"; exit 1; }

  # ── workdir ────────────────────────────────────────────────────────
  # Build with a custom workdir and verify it took effect.
  workdir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7

      - name: Build with custom workdir
        id: prep
        uses: ./
        with:
          distro: 'alpine'
          distro-version: '3.20'
          tag: 'workdir-test-${{ github.sha }}'
          workdir: '/opt/myproject'

      - name: Verify workdir
        run: |
          got=$(podman run --rm "${{ steps.prep.outputs.image }}" pwd)
          [[ "$got" == "/opt/myproject" ]] \
            || { echo "::error::expected /opt/myproject, got $got"; exit 1; }

  # ── suffix ─────────────────────────────────────────────────────────
  # Build with a custom suffix and verify the image path.
  suffix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7

      - name: Build with custom suffix
        id: prep
        uses: ./
        with:
          distro: 'alpine'
          distro-version: '3.20'
          tag: 'suffix-test-${{ github.sha }}'
          suffix: 'custom/path'

      - name: Verify image path contains custom suffix
        run: |
          image="${{ steps.prep.outputs.image }}"
          [[ "$image" == *"/custom/path:"* ]] \
            || { echo "::error::image path should contain custom/path: $image"; exit 1; }

  # ── Validation: bad base-image (no version) ────────────────────────
  bad-base-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7

      - name: Should fail with no version tag
        id: bad
        uses: ./
        continue-on-error: true
        with:
          base-image: 'fedora'
          tag: 'should-not-build'

      - name: Verify it failed
        run: |
          [[ "${{ steps.bad.outcome }}" == "failure" ]] \
            || { echo "::error::expected failure for base-image without version"; exit 1; }

  # ── Validation: bad tag ────────────────────────────────────────────
  bad-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7

      - name: Should fail with invalid tag
        id: bad
        uses: ./
        continue-on-error: true
        with:
          distro: 'alpine'
          distro-version: '3.20'
          tag: '.starts-with-dot'

      - name: Verify it failed
        run: |
          [[ "${{ steps.bad.outcome }}" == "failure" ]] \
            || { echo "::error::expected failure for invalid tag"; exit 1; }

  # ── Fork PR: upstream cache hit ─────────────────────────────────
  # Simulate a fork PR where the upstream image already exists.
  # First build the image normally via the action, then run the
  # script directly with INPUT_USER_REPO set to a fake fork.
  # The second call should find the upstream image without rebuilding.
  fork-pr-upstream-hit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7

      - name: Build image in upstream registry
        id: upstream
        uses: ./
        with:
          distro: 'alpine'
          distro-version: '3.20'
          tag: 'fork-up-${{ github.sha }}'
          packages: 'curl'

      - name: Simulate fork PR (upstream hit)
        id: fork
        run: |
          GITHUB_OUTPUT="$(mktemp)"
          export GITHUB_OUTPUT
          python3 container-prep.py \
            from-scratch \
            --distro 'alpine' \
            --distro-version '3.20' \
            --tag 'fork-up-${{ github.sha }}' \
            --packages 'curl' \
            --user '${{ github.actor }}' \
            --token '${{ github.token }}' \
            --user-repo 'fake-user/fake-fork' \
            --upstream-repo '${{ github.repository }}'
          echo "build-skipped=$(grep '^build-skipped=' "$GITHUB_OUTPUT" | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          # Re-parse outputs for the verification step
          cat "$GITHUB_OUTPUT"
          grep '^build-skipped=true' "$GITHUB_OUTPUT" \
            || { echo "::error::fork should have found the upstream image"; exit 1; }
          grep "^image=${{ steps.upstream.outputs.image }}$" "$GITHUB_OUTPUT" \
            || { echo "::error::fork should return the upstream image reference"; exit 1; }

  # ── Fork PR: build pushes to upstream ────────────────────────────
  # When no cached image exists anywhere, a fork PR should still
  # build and push to the upstream registry (not the fork's).
  fork-pr-pushes-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7

      - name: Simulate fork PR (no cache, verify build targets upstream)
        run: |
          GITHUB_OUTPUT="$(mktemp)"
          export GITHUB_OUTPUT
          python3 container-prep.py \
            from-scratch \
            --distro 'alpine' \
            --distro-version '3.20' \
            --tag 'fork-build-${{ github.sha }}' \
            --user '${{ github.actor }}' \
            --token '${{ github.token }}' \
            --user-repo 'fake-user/fake-fork' \
            --upstream-repo '${{ github.repository }}'
          # Verify the script detected the fork
          grep -q 'Fork PR detected' "$GITHUB_OUTPUT" \
            && { echo "::error::fork detection should not be in GITHUB_OUTPUT"; exit 1; } \
            || true
          # Verify the image was pushed to upstream, not the fork
          image=$(grep '^image=' "$GITHUB_OUTPUT" | cut -d= -f2)
          [[ "$image" == *"${{ github.repository }}"* ]] \
            || { echo "::error::image should target upstream repo, got: $image"; exit 1; }
          [[ "$image" != *"fake-user/fake-fork"* ]] \
            || { echo "::error::image should not target fork repo"; exit 1; }
          grep -q 'build-skipped=false' "$GITHUB_OUTPUT" \
            || { echo "::error::build should not have been skipped"; exit 1; }

  # ── Platform ────────────────────────────────────────────────────────
  # Build with an explicit --platform and verify the image architecture
  # and that the arch is included in the image path.
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7

      - name: Build with explicit platform
        id: prep
        uses: ./
        with:
          distro: 'alpine'
          distro-version: '3.20'
          tag: 'platform-test-${{ github.sha }}'
          platform: 'linux/amd64'

      - name: Verify image architecture
        run: |
          arch=$(podman inspect "${{ steps.prep.outputs.image }}" \
            --format '{{.Architecture}}')
          [[ "$arch" == "amd64" ]] \
            || { echo "::error::expected amd64 architecture, got $arch"; exit 1; }

      - name: Verify image path contains arch
        run: |
          image="${{ steps.prep.outputs.image }}"
          [[ "$image" == *"/alpine/3.20/amd64:"* ]] \
            || { echo "::error::image path should contain /alpine/3.20/amd64: $image"; exit 1; }

  # ── Platform with explicit suffix ──────────────────────────────────
  # When both platform and suffix are set, the suffix should be used
  # as-is without appending the architecture.
  platform-with-suffix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7

      - name: Build with platform and explicit suffix
        id: prep
        uses: ./
        with:
          distro: 'alpine'
          distro-version: '3.20'
          tag: 'platsuffix-test-${{ github.sha }}'
          platform: 'linux/amd64'
          suffix: 'custom/path'

      - name: Verify suffix is used without arch appended
        run: |
          image="${{ steps.prep.outputs.image }}"
          [[ "$image" == *"/custom/path:"* ]] \
            || { echo "::error::image path should contain /custom/path: $image"; exit 1; }
          [[ "$image" != *"/amd64:"* ]] \
            || { echo "::error::arch should not be appended when suffix is explicit: $image"; exit 1; }

  # ── Dockerfile ──────────────────────────────────────────────────
  # Build from a Dockerfile instead of the package-install flow.
  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7

      - name: Create test Dockerfile
        run: |
          cat > Dockerfile.test <<'EOF'
          FROM alpine:3.20
          RUN apk add --no-cache curl
          RUN touch /dockerfile-marker
          EOF

      - name: Build with Dockerfile
        id: prep
        uses: ./
        with:
          dockerfile: 'Dockerfile.test'
          tag: 'dockerfile-test-${{ github.sha }}'

      - name: Verify marker file exists
        run: |
          podman run --rm "${{ steps.prep.outputs.image }}" \
            test -f /dockerfile-marker \
            || { echo "::error::/dockerfile-marker not found"; exit 1; }

      - name: Verify curl is installed
        run: |
          podman run --rm "${{ steps.prep.outputs.image }}" \
            curl --version \
            || { echo "::error::curl not found in image"; exit 1; }

      - name: Verify image path contains distro from FROM line
        run: |
          image="${{ steps.prep.outputs.image }}"
          [[ "$image" == *"/alpine/3.20:"* ]] \
            || { echo "::error::image path should contain /alpine/3.20: $image"; exit 1; }

  # ── Dockerfile with distro override ────────────────────────────────
  # Build from a Dockerfile but override the distro/version used in
  # the image path.
  dockerfile-distro-override:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7

      - name: Create test Dockerfile
        run: |
          cat > Dockerfile.test <<'EOF'
          FROM debian:stable
          RUN touch /override-marker
          EOF

      - name: Build with Dockerfile and distro override
        id: prep
        uses: ./
        with:
          dockerfile: 'Dockerfile.test'
          distro: 'alpine'
          distro-version: '3.20'
          tag: 'df-override-test-${{ github.sha }}'

      - name: Verify image path uses overridden distro
        run: |
          image="${{ steps.prep.outputs.image }}"
          [[ "$image" == *"/alpine/3.20:"* ]] \
            || { echo "::error::image path should contain /alpine/3.20: $image"; exit 1; }

  # ── No packages ───────────────────────────────────────────────────
  # Build with no packages at all -- should produce a working image.
  no-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7

      - name: Build without packages
        id: prep
        uses: ./
        with:
          distro: 'alpine'
          distro-version: '3.20'
          tag: 'nopkg-test-${{ github.sha }}'

      - name: Verify image works
        run: |
          podman run --rm "${{ steps.prep.outputs.image }}" echo "ok"
